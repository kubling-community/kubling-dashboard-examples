
---
name: "{{ vdb_name }}"
version: "{{ vdb_version }}"

dataSources:
  - name: "tsdb_metrics"
    dataSourceType: "POSTGRESQL"
    configObject:
      dataSourceName: "tsdb-postgresql"
      serverAddress: "{{ timescale_host }}"
      serverPort: {{ timescale_port }}
      databaseName: "{{ timescale_db }}"
      userName: "{{ timescale_user }}"
      token: "{{ timescale_password }}"
      maxConnectionPoolSize: 5
      minConnectionPoolSize: 1
      maxConnectionIdleMilliseconds: 7200000
      maxConnectionLifeTimeMilliseconds: 14400000
      cache:
        enabled: false
        ttlSeconds: 43200
      allowBruteForceOperations: false
    schema:
      type: "PHYSICAL"
      properties:
        importer.schemaName: "{{ timescale_metrics_schema }}"
        importer.useFullSchemaName: "true"
        importer.useCatalogName: "false"
      cacheDefaultStrategy: "CACHE"

  - name: kube_cluster_1
    dataSourceType: PROVIDER_GRPC
    configObject:
      address: kube-provider-1
      port: 50051
      securityConfig:
        mode: PLAINTEXT
      cache:
        enabled: false
      softTransactions:
        enabled: false
      contributesToHealth: true
    schema:
      type: PHYSICAL
      cacheDefaultStrategy: NO_CACHE

  - name: kube_cluster_2
    dataSourceType: PROVIDER_GRPC
    configObject:
      address: kube-provider-2
      port: 50051
      securityConfig:
        mode: PLAINTEXT
      cache:
        enabled: false
      softTransactions:
        enabled: false
      contributesToHealth: true
    schema:
      type: PHYSICAL
      cacheDefaultStrategy: NO_CACHE

aggregatorSchemaModels:
  - name: k8s
    schemas:
      - kube_cluster_1
      - kube_cluster_2
    tables:
      - name: DEPLOYMENT
      - name: EVENT
      - name: HORIZONTAL_POD_AUTOSCALER
      - name: JOB
      - name: NAMESPACE
      - name: NODE
      - name: PERSISTENT_VOLUME
      - name: PERSISTENT_VOLUME_CLAIM
      - name: POD
      - name: SECRET
