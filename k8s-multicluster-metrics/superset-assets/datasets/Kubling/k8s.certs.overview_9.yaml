table_name: k8s.certs.overview
main_dttm_col: null
currency_code_column: null
description: TLS certificates and certificates expiring within ten days.
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: null
sql: |
  SELECT
          cert.clusterName,
          cert.namespace,
          cert.secret_name,
          jsonPretty(cert.cert_info) AS cert_info,
          CASE
              WHEN jsonPathAsString(cert.cert_info, '$[?(@.expirationDays <= 10)]') IS NOT NULL
                  THEN 'YES'
              ELSE 'NO'
          END AS any_about_to_expire
      FROM (
          SELECT
              secret.clusterName,
              secret.metadata__namespace AS namespace,
              secret.metadata__name AS secret_name,
              x509_cert_exp_days(
                  CAST(
                      to_chars(
                          to_bytes(jsonPathAsString(secret.data, '$.["tls.crt"]'), 'base64'),
                          'UTF-8'
                      ) AS string
                  )
              ) AS cert_info
          FROM k8s.SECRET secret
          WHERE secret.type = 'kubernetes.io/tls'
      ) cert
