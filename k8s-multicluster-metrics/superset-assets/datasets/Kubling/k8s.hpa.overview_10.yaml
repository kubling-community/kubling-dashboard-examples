table_name: k8s.hpa.overview
main_dttm_col: null
currency_code_column: null
description: Current scaling targets and most recently changed HPA condition.
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: null
sql: "SELECT \n    hpa.clusterName,\n    hpa.metadata__namespace AS namespace,\n    hpa.metadata__name AS hpa_name,\n    hpa.spec__minReplicas as min_replicas,\n    hpa.spec__maxReplicas as max_replicas,\n    hpa.status__currentReplicas as current_replicas,\n    hpa.status__desiredReplicas as desired_replicas,\n    convert(latest_condition.latest_transition_time, timestamp) as latest_transition_time,\n    jsonPathAsString(\n        hpa.status__conditions, \n        '$[?(@.lastTransitionTime == \"' || latest_condition.latest_transition_time || '\")].type'\n    ) AS condition_type,\n    jsonPathAsString(\n        hpa.status__conditions, \n        '$[?(@.lastTransitionTime == \"' || latest_condition.latest_transition_time || '\")].status'\n    ) AS condition_status,\n    jsonPathAsString(\n        hpa.status__conditions, \n        '$[?(@.lastTransitionTime == \"' || latest_condition.latest_transition_time || '\")].message'\n    ) AS condition_message,\n    jsonPathAsString(\n        hpa.status__conditions, \n        '$[?(@.lastTransitionTime == \"' || latest_condition.latest_transition_time || '\")].reason'\n    ) AS condition_reason\nFROM k8s.HORIZONTAL_POD_AUTOSCALER hpa\nINNER JOIN (\n    SELECT \n        aa.clusterName,\n        aa.identifier, \n        jsonJqAsString(aa.status__conditions, 'max_by(.lastTransitionTime) | .lastTransitionTime') AS latest_transition_time\n    FROM k8s.HORIZONTAL_POD_AUTOSCALER aa\n) latest_condition\nON hpa.clusterName = latest_condition.clusterName\nAND hpa.identifier = latest_condition.identifier;\n"
