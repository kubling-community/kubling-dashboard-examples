table_name: k8s.error.events
main_dttm_col: observed_time
currency_code_column: null
description: Most recently observed warning event for each object and cluster.
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: null
sql: |
  SELECT
          e.clusterName,
          e.metadata__namespace AS namespace,
          e.regarding__kind AS regarding_kind,
          e.regarding__name AS regarding_name,
          e.type AS event_type,
          e.reason,
          e.note,
          COALESCE(e.series__count, 1) AS occurrences,
          COALESCE(e.series__lastObservedTime, e.eventTime, e.metadata__creationTimestamp) AS observed_time
      FROM k8s.EVENT e
      INNER JOIN (
          SELECT
              clusterName,
              regarding__uid,
              MAX(COALESCE(series__lastObservedTime, eventTime, metadata__creationTimestamp)) AS observed_time
          FROM k8s.EVENT
          WHERE type IN ('Warning', 'Error')
            AND regarding__uid IS NOT NULL
          GROUP BY clusterName, regarding__uid
      ) latest
          ON latest.clusterName = e.clusterName
         AND latest.regarding__uid = e.regarding__uid
         AND latest.observed_time = COALESCE(e.series__lastObservedTime, e.eventTime, e.metadata__creationTimestamp)
      WHERE e.type IN ('Warning', 'Error')
