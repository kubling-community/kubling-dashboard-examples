table_name: k8s.jobs.overview
main_dttm_col: null
currency_code_column: null
description: Job counts by cluster and namespace, including active, succeeded and failed-pod states.
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: null
sql: |
  SELECT
          j.clusterName,
          j.metadata__namespace AS namespace,
          COUNT(DISTINCT j.identifier) AS total_jobs_count,
          SUM(CASE WHEN COALESCE(j.status__failed, 0) > 0 THEN 1 ELSE 0 END) AS jobs_with_failed_pods,
          SUM(CASE WHEN COALESCE(j.status__active, 0) > 0 THEN 1 ELSE 0 END) AS running_jobs_count,
          SUM(CASE WHEN COALESCE(j.status__succeeded, 0) > 0 AND COALESCE(j.status__active, 0) = 0 THEN 1 ELSE 0 END) AS succeeded_jobs_count
      FROM k8s.JOB j
      GROUP BY j.clusterName, j.metadata__namespace
