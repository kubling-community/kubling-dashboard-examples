table_name: k8s.pod.issues
main_dttm_col: null
currency_code_column: null
description: Pending, failed, unknown or non-ready running pods.
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: null
sql: |
  SELECT
          p.clusterName,
          p.metadata__namespace AS namespace,
          p.metadata__name AS pod_name,
          COALESCE(p.status__phase, 'Unknown') AS pod_phase,
          p.status__reason AS pod_reason,
          p.status__message AS pod_message,
          jsonPathAsString(problem.condition_data, '$.type') AS condition_type,
          jsonPathAsString(problem.condition_data, '$.reason') AS condition_reason,
          jsonPathAsString(problem.condition_data, '$.message') AS condition_message,
          jsonPathAsString(problem.condition_data, '$.lastTransitionTime') AS condition_last_transition_time,
          jsonJqAsString(p.status__containerStatuses, '(. // []) | map(.state.waiting.reason // .state.terminated.reason // empty) | unique | join(", ")') AS container_reasons,
          jsonJqAsString(p.status__initContainerStatuses, '(. // []) | map(.state.waiting.reason // .state.terminated.reason // empty) | unique | join(", ")') AS init_container_reasons,
          jsonJqAsString(p.status__ephemeralContainerStatuses, '(. // []) | map(.state.waiting.reason // .state.terminated.reason // empty) | unique | join(", ")') AS ephemeral_container_reasons
      FROM k8s.POD p
      LEFT OUTER JOIN (
          SELECT
              clusterName,
              identifier,
              jsonJqAsString(
                  status__conditions,
                  '(. // []) | map(select((.type == "Ready" or .type == "ContainersReady" or .type == "PodScheduled") and .status == "False")) | sort_by(.lastTransitionTime) | last // null'
              ) AS condition_data
          FROM k8s.POD
      ) problem ON problem.clusterName = p.clusterName
               AND problem.identifier = p.identifier
      WHERE COALESCE(p.status__phase, 'Unknown') IN ('Pending', 'Failed', 'Unknown')
         OR (
             p.status__phase = 'Running'
             AND problem.condition_data IS NOT NULL
         )
