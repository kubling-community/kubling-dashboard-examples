table_name: k8s.deploy.issues
main_dttm_col: null
currency_code_column: null
description: Deployments that are unavailable, partially degraded or failing to progress.
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: null
sql: |
  SELECT
          d.clusterName,
          d.metadata__namespace AS namespace,
          d.metadata__name AS deployment_name,
          COALESCE(d.spec__replicas, 1) AS desired_replicas,
          COALESCE(d.status__updatedReplicas, 0) AS updated_replicas,
          COALESCE(d.status__availableReplicas, 0) AS available_replicas,
          COALESCE(d.status__unavailableReplicas, 0) AS unavailable_replicas,
          jsonPathAsString(problem.condition_data, '$.type') AS condition_type,
          jsonPathAsString(problem.condition_data, '$.reason') AS condition_reason,
          jsonPathAsString(problem.condition_data, '$.message') AS condition_message
      FROM k8s.DEPLOYMENT d
      LEFT OUTER JOIN (
          SELECT
              clusterName,
              identifier,
              jsonJqAsString(
                  status__conditions,
                  '(. // []) | map(select((.type == "Progressing" and .status == "False") or (.type == "ReplicaFailure" and .status == "True"))) | sort_by(.lastTransitionTime) | last // null'
              ) AS condition_data
          FROM k8s.DEPLOYMENT
      ) problem ON problem.clusterName = d.clusterName
               AND problem.identifier = d.identifier
      WHERE COALESCE(d.spec__replicas, 1) > 0
        AND (
            COALESCE(d.status__availableReplicas, 0) < COALESCE(d.spec__replicas, 1)
            OR COALESCE(d.status__unavailableReplicas, 0) > 0
            OR problem.condition_data IS NOT NULL
        )
