services:
  kubling:
    image: ${KUBLING_IMAGE:?Set KUBLING_IMAGE in .env}
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "${KUBLING_HTTP_PORT:-8282}:8282"
      - "${KUBLING_GRPC_PORT:-55051}:55051"
    environment:
      ENABLE_WEB_CONSOLE: "true"
      SCRIPT_LOG_LEVEL: INFO
      APP_CONFIG: /app_data/app-config.yaml
      DESCRIPTOR_BUNDLE: /app_data/dashboard-descriptor-bundle.zip
      PROPS_FILE: /app_data/dashboard.properties
      KBL_SKIP_ENV_VAR_TEMP_FILE_ENCRYPTION: "true"
    volumes:
      - ./app-config.yaml:/app_data/app-config.yaml:ro
      - ${KUBLING_DESCRIPTOR_BUNDLE:?Run run-compose.sh}:/app_data/dashboard-descriptor-bundle.zip:ro
      - ${KUBLING_PROPERTIES_FILE:?Run run-compose.sh}:/app_data/dashboard.properties:ro

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:?Set TIMESCALE_PASSWORD in .env}
      POSTGRES_USER: ${TIMESCALE_USER:-postgres}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./db-init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 24

  superset-init:
    image: ${SUPERSET_IMAGE:-kubling-dashboard-superset:26.2.0-py312}
    depends_on:
      kubling:
        condition: service_started
    environment:
      EXAMPLE_NAME: ${EXAMPLE_NAME:?Run run-compose.sh}
      SUPERSET_CONFIG_PATH: /app/pythonpath/kubling_superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Set SUPERSET_SECRET_KEY in .env}
      SUPERSET_METADATA_URI: sqlite:////app/superset_home/superset.db
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Set SUPERSET_ADMIN_PASSWORD in .env}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.invalid}
      KUBLING_GRPC_TARGET: ${KUBLING_GRPC_TARGET:-kubling:55051}
      KUBLING_GRPC_USERNAME: ${KUBLING_GRPC_USERNAME:-}
      KUBLING_GRPC_PASSWORD: ${KUBLING_GRPC_PASSWORD:-}
      KUBLING_GRPC_INSECURE: ${KUBLING_GRPC_INSECURE:-true}
      KUBLING_VDB_NAME: ${KUBLING_VDB_NAME:-Dashboard}
      KUBLING_VDB_VERSION: ${KUBLING_VDB_VERSION:-0.1.0}
    volumes:
      - superset_data:/app/superset_home
      - ..:/workspace:ro
      - ../superset/superset_config.py:/app/pythonpath/kubling_superset_config.py:ro
    entrypoint: ["/workspace/scripts/init-superset.sh"]
    restart: "no"

  superset:
    image: ${SUPERSET_IMAGE:-kubling-dashboard-superset:26.2.0-py312}
    depends_on:
      superset-init:
        condition: service_completed_successfully
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/kubling_superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Set SUPERSET_SECRET_KEY in .env}
      SUPERSET_METADATA_URI: sqlite:////app/superset_home/superset.db
    volumes:
      - superset_data:/app/superset_home
      - ../superset/superset_config.py:/app/pythonpath/kubling_superset_config.py:ro

volumes:
  timescale_data:
  superset_data:
